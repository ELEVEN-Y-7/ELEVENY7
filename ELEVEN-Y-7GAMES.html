<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven-y-7</title>
    <style>
        body {
            background-image: url('https://raw.githubusercontent.com/ELEVEN-Y-7/ELEVENY7/main/images/background.png');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .game {
            width: 200px;
            text-align: center;
        }
        .game img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to Eleven-y-7</h1>

    <div class="game-container">
        <div class="game">
            <a href="https://www.y8.com/games/football_legends_2021" target="_blank">
                <img src="https://raw.githubusercontent.com/ELEVEN-Y-7/ELEVENY7/main/images/football_legends.png" alt="Football Legends 2021">
                <p>Football Legends 2021</p>
            </a>
        </div>

        <div class="game">
            <a href="https://www.y8.com/games/fireboy_and_watergirl_5_elements" target="_blank">
                <img src="https://raw.githubusercontent.com/ELEVEN-Y-7/ELEVENY7/main/images/fireboy_watergirl.png" alt="Fireboy and Watergirl 5 Elements">
                <p>Fireboy & Watergirl 5</p>
            </a>
        </div>

        <div class="game">
            <a href="https://www.y8.com/games/asmr_beauty_homeless" target="_blank">

            </a>
        </div>

        <div class="game">
            <a href="https://www.roblox.com/" target="_blank">

                <p>Roblox</p>
            </a>
        </div>

        <div class="game">
            <a href="https://www.minecraft.net/" target="_blank">
                <img src="https://raw.githubusercontent.com/ELEVEN-Y-7/ELEVENY7/main/images/minecraft.png" alt="Minecraft">
                <p>Minecraft</p>
            </a>
        </div>

        <div class="game">
            <a href="https://sudoku.com/" target="_blank">
                <img src="https://raw.githubusercontent.com/ELEVEN-Y-7/ELEVENY7/main/images/sudoku.png" alt="Sudoku">

            </a>
        </div>

</html>
